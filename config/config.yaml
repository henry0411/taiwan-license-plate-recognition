# 台灣車牌辨識設定檔
# 修改後執行 `docker compose restart` 生效

synology:
  # Synology Chat 傳入 webhook (含 token, 請勿外流)
  webhook_url: "https://<your-synology-host>/webapi/entry.cgi?api=SYNO.Chat.External&method=incoming&version=2&token=<YOUR_TOKEN>"
  # 附上車輛截圖: NAS 會從此網址抓圖, 須為 NAS 連得到的本機位址; 留空則只發文字
  snapshot_base_url: "http://lpr-host:8091"
  verify_ssl: true

# go2rtc (網路鏡頭 -> RTSP, go2rtc-host): 與鏡頭的連線卡住時 motionEye 只會顯示灰色「UNABLE TO OPEN VIDEO DEVICE」.
# 設定了 go2rtc_stream 的鏡頭斷線超過 restart_after 秒, 透過 API 移除再加回該串流 (不改設定檔、不重啟整個 go2rtc, 其他鏡頭不受影響);
# 同一串流兩次重設至少間隔 restart_cooldown 秒 (網路鏡頭同時只接受 2 個連線). url 留空 = 不自動處理
go2rtc:
  url: "http://go2rtc-host:1984"
  restart_after: 180
  restart_cooldown: 600

web:
  port: 8091            # 即時畫面 / 截圖: http://<主機>:8091/

detection:
  plate_detector: yolo-v9-t-384-license-plate-end2end
  ocr_models: [cct-xs-v2-global-model, cct-s-v2-global-model]  # 多模型平均, 較準
  cpu_threads: 1        # 每次推論使用的 CPU 執行緒數
  plate_conf: 0.4       # 車牌框偵測門檻
  plate_vehicle_crops: true  # 除全畫面外, 也在各車框內偵測車牌 (2K 畫面遠處車牌整張縮小後太小, 裁切後才偵測得到)
  frame_min_conf: 0.45  # 單張畫面信心低於此值 (模糊/遮擋) 不納入
  ocr_min_conf: 0.6     # 累積後的車牌信心門檻 (每字幾何平均機率)
  include_motorcycle_formats: true   # 是否接受舊式機車車牌格式 (ABC-123 / 123-ABC)
  min_votes: 3          # 至少累積幾張畫面, 且最近幾次解碼一致才確認
  ocr_interval: 1.0     # 每台車 OCR 間隔(秒)
  ocr_max_attempts: 20  # 同一車牌嘗試幾次仍無法確認後, 改用較長間隔
  ocr_retry_interval: 30  # 上述情況的 OCR 間隔(秒)
  corrupt_frame_ratio: 0.08  # 灰色馬賽克破圖 (串流掉資料) 的平坦灰色區塊比例 >= 此值則略過該張 (正常畫面實測 < 0.075)
  static_change: 0.005  # 畫面變化像素比例低於此值視為靜止, 略過偵測 (省 CPU)
  static_refresh: 10    # 靜止畫面每隔幾秒仍完整處理一次
  track_lost_seconds: 30      # 車牌消失多久後視為離開
  plate_cooldown_seconds: 21600  # 同一鏡頭同一車牌再次通知的冷卻時間 (6 小時)
  camera_offline_alert: 600   # 鏡頭超過幾秒沒有畫面就通知「鏡頭斷線」(0 = 不通知)

# 整台車輛偵測/追蹤: 車牌駛入時讀到即延續車號; 停妥後一直讀不到車牌則通知「無法辨識」
vehicle:
  model: yolov8n-416.onnx   # 車輛偵測模型 (鏡頭可用 vehicle_model 個別指定)
  pad: 0.15                 # 四周留白比例, 近距離被切掉的車較容易偵測
  conf: 0.2                 # 車輛偵測信心門檻
  interval: 2.0             # 車輛偵測間隔 (秒)
  min_area: 0.01            # 車框面積佔畫面比例下限 (排除遠處車輛)
  zone_overlap: 0.3         # 車框至少多少比例落在圍籬內才算停在區內
  lost_seconds: 60          # 偵測不到多久視為離開
  relink_seconds: 600       # 離開後多久內在同位置再出現, 視為同一台車 (保留車號)
  startup_grace: 60         # 服務啟動時已停著的車不發「無法辨識」通知
  unidentified_after: 120   # 停妥滿幾秒才發通知 (秒). 期間持續讀車牌; 停妥後讀不到則採用駛入過程中讀到的車牌, 都沒有才通知「無法辨識」
  approach_seconds: 300     # 車輛出現前多少秒內 (本鏡頭或 plate_sources 指定的鏡頭) 讀到的車牌, 可作為該車的車號
  unidentified_cooldown: 86400  # 同一位置「無法辨識」通知的冷卻時間 (秒)

# 外觀樣本收集 (data/gallery/): 供日後車輛外觀辨識
gallery:
  enabled: true
  interval: 300             # 同一台停妥車輛每隔幾秒存一張
  max_per_track: 6          # 每次停車最多存幾張
  max_per_plate: 300        # 每個車號最多保留幾張 (超過刪最舊)
  save_others: true         # 非白名單車輛也存 (日後評估誤認率用)

# 機車外觀辨識 (DINOv2): 讀不到車牌的機車停入時, 比對是哪一台自家機車, 通知改為「<名稱> 停入」
# 參考圖: data/appearance/<名稱>/*.jpg (整台車裁切圖, 白天與夜間都要有; 增刪後自動生效, 不需重啟)
# 停入裁切圖留存於 data/appearance/_arrivals/, 認錯時把圖移到正確車名資料夾即可加強
# 鏡頭需設定 appearance_match: true 才會比對
appearance:
  min_similarity: 0.70      # 最像的那台相似度須 >= 此值 (被擋住的局部/汽車誤判約 0.5~0.7)
  min_margin: 0.06          # 且須比第二名高出此值, 否則視為無法確定 (維持「有機車停入」)
  save_arrivals: true

cameras:
  # name: 內部代號 (截圖檔名/原位參考資料夾, 請勿更改); label: 通知訊息與網頁上顯示的名稱
  # outside_1 (同一台雙鏡頭攝影機的另一顆鏡頭, 640x360, 與 outside_2 拍同一段路) 已停用; 要恢復請取消以下註解
  # - name: outside_1
  #   label: 車庫外
  #   url: "http://camera-host:9084/"
  #   process_fps: 1
  #   # 電子圍籬: 紅線右側停車區, 車牌中心在多邊形內才辨識 (座標為畫面比例 0~1)
  #   zone: [[0.14, 1.0], [0.905, 0.155], [1.0, 0.075], [1.0, 1.0]]
  #   # 排除區: 車框一半以上落在其中的偵測結果忽略 (人行道上的水溝蓋常被誤判為車輛)
  #   ignore:
  #     - [[0.27, 0.84], [0.47, 0.84], [0.47, 1.0], [0.27, 1.0]]
  #     - [[0.71, 0.35], [0.84, 0.35], [0.84, 0.49], [0.71, 0.49]]
  #     - [[0.87, 0.16], [0.96, 0.16], [0.96, 0.25], [0.87, 0.25]]
  #   dwell_seconds: 10     # 車牌在圍籬內靜止超過幾秒才辨識 (排除路過車輛)
  #   plate_sources: [outside_1, outside_2]   # 同一台雙鏡頭攝影機, 拍同一段路邊, 互相採用對方讀到的車牌
  #   vehicle_pad: 0.0              # 640x360 畫面: 不留白時近處黑色車信心 0.53 (留白 0.15 偵測不到)

  - name: outside_2
    label: 車庫外旋轉鏡頭
    url: "http://camera-host:9085/"
    go2rtc_stream: cam_outside_2   # 斷線時自動重設此 go2rtc 串流 (未設定的鏡頭不自動處理)
    process_fps: 1
    # 旋轉鏡頭 (行人追蹤): 只有轉回原位時才辨識.
    # 原位參考畫面: 在網頁上鏡頭停在原位時按「設為原位參考」(建議白天、夜間各存一張)
    rotating: true
    # 電子圍籬: 紅線右側 (座標以原位參考畫面為準, 畫面比例 0~1)
    zone: [[0.19, 1.0], [0.78, 0.2], [0.83, 0.13], [1.0, 0.13], [1.0, 1.0]]
    # 排除區 (座標以原位參考畫面為準): 紅線旁的兩個水溝蓋
    ignore:
      - [[0.55, 0.45], [0.70, 0.45], [0.70, 0.63], [0.55, 0.63]]
      - [[0.71, 0.28], [0.80, 0.28], [0.80, 0.37], [0.71, 0.37]]
    dwell_seconds: 10
    # 紅線外臨停: 紅線與雙黃線之間的車道 (座標以原位參考畫面為準); 車輛著地點在區內且靜止 road_stop_seconds 秒以上 -> 通知
    # 同一位置 road_notify_cooldown 秒內不重複通知. 對向路邊停車 (雙黃線另一側) 不在範圍內
    road_zone: [[0.0, 0.39], [0.78, 0.04], [0.785, 0.215], [0.20, 1.0], [0.0, 1.0]]
    road_stop_seconds: 60
    road_notify_cooldown: 600
    vehicle_model: yolov8n.onnx   # 2K 畫面 (go2rtc subtype=3): 640 模型 + 不留白, 實測 近處汽車 0.85 / 416+留白 0.15 偵測不到
    vehicle_pad: 0.0

  - name: garage
    label: 車庫內
    url: "http://camera-host:9081/"
    process_fps: 0.5
    vehicle_model: yolov8n.onnx   # 室內機車較小, 用 640 模型
    vehicle_pad: 0.0
    notify_unidentified: false    # 室內車庫的自家機車常拍不到車牌, 不通知「無法辨識」(仍記錄)
    # 進車通知: 車輛停妥 vehicle.unidentified_after 秒 (2 分鐘) 後傳照片 (駛入時有讀到車牌則改發車牌通知);
    # 同一位置 parked_rearm_seconds 秒內一直有車停著則不重複通知 (車離開超過此時間後再停入才通知)
    notify_parked: true
    appearance_match: true        # 讀不到車牌的機車以外觀辨識是哪一台 (見上方 appearance)
    parked_rearm_seconds: 600
    # 停入前後比對: 車框區域與停入前 (1~30 分鐘前靜止畫面) 的邊緣相似度 >= 此值 = 原本就停著 (被人/車擋住後重新追蹤), 不通知
    arrival_same_similarity: 0.5
    # 已停妥的車, 車框中心位移超過車寬此比例才算移動 (未停妥時仍為 0.1); 避免偵測框抖動造成重複「停妥」
    parked_still_ratio: 0.3
    vehicle_conf: 0.12            # 夜間紅外線畫面機車信心常只有 0.13~0.36, 車庫內門檻放寬 (其他鏡頭用 vehicle.conf)
    vehicle_min_area: 0.04        # 車庫內車輛都很近, 小框多半是被擋住的局部 (座墊/車尾) 誤判
    zone: null            # 不設圍籬, 全畫面辨識
    dwell_seconds: 3
    # 駛入時多讀幾張車牌: 畫面有動靜後 motion_hold_seconds 秒內改用 motion_fps 處理 (平時 process_fps)
    motion_fps: 3
    motion_hold_seconds: 15
    min_votes: 2                  # 駛入時車牌只出現幾秒, 車庫內 2 張一致即確認 (其他鏡頭用 detection.min_votes)
    # 有動靜時存原始畫面到 data/motion/garage/ (每秒最多 1 張, 保留最近 1500 張), 供確認駛入時是否拍得到車牌
    save_motion_frames: true
    save_motion_frames_keep: 1500
